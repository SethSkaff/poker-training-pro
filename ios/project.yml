name: PokerTrainingPro

options:
  bundleIdPrefix: com.pokertraining
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true

targets:
  PokerTrainingPro:
    type: application
    platform: iOS
    sources:
      - path: PokerTrainingPro
        excludes:
          - Resources
    resources:
      - path: PokerTrainingPro/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokertraining.pro
        PRODUCT_NAME: Poker Training Pro
        PRODUCT_MODULE_NAME: PokerTrainingPro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Poker Training Pro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - sdk: JavaScriptCore.framework

  PokerTrainingProTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PokerTrainingProTests
        excludes:
          - Fixtures
    resources:
      - path: Tests/PokerTrainingProTests/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokertraining.pro.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Poker Training Pro.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Poker Training Pro"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: PokerTrainingPro

schemes:
  PokerTrainingPro:
    build:
      targets:
        PokerTrainingPro: all
        PokerTrainingProTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PokerTrainingProTests
          parallelizable: true
    archive:
      config: Release

