name: Release quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic release verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean lockfile install
        run: npm ci

      - name: Verify release inputs and production artifacts
        run: npm run release:verify

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-reports
          if-no-files-found: warn
          path: |
            work/release-manifest.json
            work/dependency-security.json
            work/poker-training-pro-0.1.0.cdx.json
            work/third-party-audit.md
