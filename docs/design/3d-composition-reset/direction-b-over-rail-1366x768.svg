<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title desc">
  <title id="title">Direction B — elevated over-the-rail composition at 1366 by 768</title>
  <desc id="desc">A slightly elevated seated camera shows most of an oval table and all five opponents, emphasizing readable cards, bets, pots and markers while retaining a hero rail and hands at the bottom.</desc>
  <defs>
    <linearGradient id="roomB" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17201d"/><stop offset=".38" stop-color="#09110f"/><stop offset="1" stop-color="#020605"/></linearGradient>
    <radialGradient id="feltB"><stop stop-color="#287c63"/><stop offset="1" stop-color="#0c3b2e"/></radialGradient>
    <filter id="shadowB" x="-25%" y="-25%" width="150%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-opacity=".7"/></filter>
    <style>
      .ui { font-family: Inter, Segoe UI, sans-serif; fill:#f4f8f5 }
      .micro { font-family: Inter, Segoe UI, sans-serif; font-size:10px; fill:#9fb4ad; letter-spacing:.08em }
      .label { font-family: Inter, Segoe UI, sans-serif; font-size:12px; font-weight:800; fill:#f3f8f5 }
      .amount { font-family: Inter, Segoe UI, sans-serif; font-size:10px; font-weight:700; fill:#7fe4ca }
      .annot { font-family: Inter, Segoe UI, sans-serif; font-size:10px; font-weight:800; fill:#f0c66a; letter-spacing:.06em }
      .plate { fill:#05100c; fill-opacity:.94; stroke:#526e66 }
      .chip { fill:#2d7cab; stroke:#bee4f6 }
    </style>
  </defs>
  <rect width="1366" height="768" fill="url(#roomB)"/>
  <rect x="1" y="1" width="1364" height="766" fill="none" stroke="#46665d" stroke-width="2"/>
  <path d="M0 133 H1366" stroke="#c0d9d0" stroke-opacity=".25" stroke-dasharray="9 10"/>
  <text x="24" y="124" class="micro">HORIZON 17% · ELEVATED EYE LINE</text>
  <g opacity=".26">
    <ellipse cx="130" cy="163" rx="78" ry="20" fill="#17543f" stroke="#68482d" stroke-width="7"/>
    <ellipse cx="1218" cy="163" rx="78" ry="20" fill="#17543f" stroke="#68482d" stroke-width="7"/>
    <path d="M270 0 h42 l75 150 h-190 zM690 0 h42 l75 150 h-190 zM1090 0 h42 l75 150 h-190 z" fill="#ffe0a0" opacity=".4"/>
  </g>

  <!-- Compact HUD and skip -->
  <g class="ui">
    <rect x="18" y="14" width="1330" height="42" rx="11" fill="#020b08" fill-opacity=".9" stroke="#35554d"/>
    <text x="38" y="31" class="micro">LOCAL QUALIFIER · HAND 1 · 6 REMAIN</text>
    <text x="683" y="39" text-anchor="middle" class="label">BLINDS 25/50 · ANTE 50 · POT 1,250</text>
    <rect x="1238" y="20" width="90" height="30" rx="8" fill="#f1bc52"/><text x="1283" y="40" text-anchor="middle" fill="#201306" font-weight="900">SKIP</text>
  </g>

  <!-- Opponents are all beyond the hero rail; higher pitch shows their hands -->
  <g filter="url(#shadowB)">
    <g transform="translate(198 310)"><path d="M-42 18Q0-13 42 18L48 87H-48Z" fill="#3b5363"/><circle cy="2" r="23" fill="#bc8868"/><rect class="plate" x="-70" y="77" width="140" height="38" rx="9"/><text class="label" x="0" y="93" text-anchor="middle">Zuri Eriksen</text><text class="amount" x="0" y="108" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(412 196)"><path d="M-38 18Q0-12 38 18L44 80H-44Z" fill="#594155"/><circle cy="2" r="22" fill="#9e7057"/><rect class="plate" x="-68" y="72" width="136" height="38" rx="9"/><text class="label" x="0" y="88" text-anchor="middle">Onyx Frost</text><text class="amount" x="0" y="103" text-anchor="middle">CHECK · 15,000</text></g>
    <g transform="translate(683 160)"><path d="M-38 18Q0-12 38 18L44 80H-44Z" fill="#3f5669"/><circle cy="2" r="22" fill="#c9986f"/><ellipse cy="88" rx="66" ry="21" fill="none" stroke="#f3c15c" stroke-width="5"/><rect class="plate" x="-68" y="72" width="136" height="38" rx="9" stroke="#f3c15c"/><text class="label" x="0" y="88" text-anchor="middle">Tam Batista</text><text class="amount" x="0" y="103" text-anchor="middle">CURRENT ACTOR</text></g>
    <g transform="translate(954 196)"><path d="M-38 18Q0-12 38 18L44 80H-44Z" fill="#415b45"/><circle cy="2" r="22" fill="#b97d58"/><rect class="plate" x="-68" y="72" width="136" height="38" rx="9"/><text class="label" x="0" y="88" text-anchor="middle">Casey Ibarra</text><text class="amount" x="0" y="103" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(1168 310)"><path d="M-42 18Q0-13 42 18L48 87H-48Z" fill="#57413a"/><circle cy="2" r="23" fill="#d0a078"/><rect class="plate" x="-70" y="77" width="140" height="38" rx="9"/><text class="label" x="0" y="93" text-anchor="middle">Indigo Moreno</text><text class="amount" x="0" y="108" text-anchor="middle">14,975 · 299.5 bb</text></g>
  </g>

  <!-- More top surface, less room: readability-first oval -->
  <ellipse cx="683" cy="453" rx="535" ry="254" fill="#27180f" stroke="#8c5933" stroke-width="22" filter="url(#shadowB)"/>
  <ellipse cx="683" cy="438" rx="505" ry="224" fill="url(#feltB)" stroke="#cf9954" stroke-opacity=".45" stroke-width="3"/>

  <!-- Readable rail plates are layered over the physical table -->
  <g>
    <g transform="translate(128 387)"><rect class="plate" width="140" height="38" rx="9"/><text class="label" x="70" y="16" text-anchor="middle">Zuri Eriksen</text><text class="amount" x="70" y="31" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(344 232)"><rect class="plate" width="136" height="38" rx="9"/><text class="label" x="68" y="16" text-anchor="middle">Onyx Frost</text><text class="amount" x="68" y="31" text-anchor="middle">CHECK · 15,000</text></g>
    <g transform="translate(615 204)"><rect class="plate" width="136" height="38" rx="9" stroke="#f3c15c"/><text class="label" x="68" y="16" text-anchor="middle">Tam Batista</text><text class="amount" x="68" y="31" text-anchor="middle">CURRENT ACTOR</text></g>
    <g transform="translate(886 232)"><rect class="plate" width="136" height="38" rx="9"/><text class="label" x="68" y="16" text-anchor="middle">Casey Ibarra</text><text class="amount" x="68" y="31" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(1098 387)"><rect class="plate" width="140" height="38" rx="9"/><text class="label" x="70" y="16" text-anchor="middle">Indigo Moreno</text><text class="amount" x="70" y="31" text-anchor="middle">14,975 · 299.5 bb</text></g>
  </g>

  <!-- Opponent cards and committed lanes -->
  <g>
    <g fill="#18382f" stroke="#a9c2b9"><rect x="237" y="340" width="34" height="48" rx="4" transform="rotate(-23 254 364)"/><rect x="271" y="330" width="34" height="48" rx="4" transform="rotate(-18 288 354)"/></g>
    <g fill="#18382f" stroke="#a9c2b9"><rect x="448" y="270" width="34" height="48" rx="4" transform="rotate(-11 465 294)"/><rect x="484" y="265" width="34" height="48" rx="4" transform="rotate(-7 501 289)"/></g>
    <g fill="#18382f" stroke="#a9c2b9"><rect x="646" y="242" width="34" height="48" rx="4"/><rect x="686" y="242" width="34" height="48" rx="4"/></g>
    <g fill="#18382f" stroke="#a9c2b9"><rect x="848" y="265" width="34" height="48" rx="4" transform="rotate(7 865 289)"/><rect x="884" y="270" width="34" height="48" rx="4" transform="rotate(11 901 294)"/></g>
    <g fill="#18382f" stroke="#a9c2b9"><rect x="1061" y="330" width="34" height="48" rx="4" transform="rotate(18 1078 354)"/><rect x="1095" y="340" width="34" height="48" rx="4" transform="rotate(23 1112 364)"/></g>
  </g>

  <!-- Poker state organized in visible lanes -->
  <g class="ui">
    <g transform="translate(520 377)">
      <rect width="46" height="64" rx="5" fill="#fffaf0"/><text x="8" y="20" fill="#c63838" font-weight="900">2♦</text>
      <rect x="52" width="46" height="64" rx="5" fill="#fffaf0"/><text x="60" y="20" fill="#202724" font-weight="900">3♠</text>
      <rect x="104" width="46" height="64" rx="5" fill="#fffaf0"/><text x="112" y="20" fill="#202724" font-weight="900">2♣</text>
      <rect x="156" width="46" height="64" rx="5" fill="#16392e" stroke="#77988c" stroke-dasharray="4 4"/>
      <rect x="208" width="46" height="64" rx="5" fill="#16392e" stroke="#77988c" stroke-dasharray="4 4"/>
    </g>
    <g transform="translate(640 488)"><ellipse class="chip" rx="19" ry="7"/><rect x="-19" y="-28" width="38" height="28" fill="#256d98"/><ellipse class="chip" cy="-28" rx="19" ry="7"/><text x="0" y="20" class="micro" text-anchor="middle">MAIN 1,125</text></g>
    <g transform="translate(753 492)"><rect x="-48" y="-29" width="96" height="55" rx="13" fill="none" stroke="#a0d6c5" stroke-dasharray="5 5"/><ellipse cx="0" cy="-8" rx="15" ry="6" fill="#d29932"/><text x="0" y="18" class="micro" text-anchor="middle">SIDE-POT REGION</text></g>
    <circle cx="991" cy="338" r="16" fill="#f4f0e5" stroke="#efc360" stroke-width="2"/><text x="991" y="343" text-anchor="middle" fill="#21160d" font-weight="900">D</text>
    <rect x="1090" y="412" width="34" height="20" rx="10" fill="#8bc8ff"/><text x="1107" y="426" text-anchor="middle" fill="#11233a" font-size="10" font-weight="900">SB</text>
    <rect x="242" y="412" width="34" height="20" rx="10" fill="#efc45d"/><text x="259" y="426" text-anchor="middle" fill="#30230c" font-size="10" font-weight="900">BB</text>
  </g>

  <!-- Hero rail, forearms, cards and chips -->
  <path d="M195 592 Q683 716 1171 592 L1124 690 Q683 780 242 690 Z" fill="#080a08" stroke="#6f4128" stroke-width="12"/>
  <path d="M252 646 Q315 596 385 625" fill="none" stroke="#b88263" stroke-width="25" stroke-linecap="round" opacity=".9"/>
  <path d="M1114 646 Q1051 596 981 625" fill="none" stroke="#b88263" stroke-width="25" stroke-linecap="round" opacity=".9"/>
  <g transform="translate(567 548) rotate(-4)"><rect width="74" height="104" rx="8" fill="#fdf8eb" stroke="#d4cbb7" stroke-width="3"/><text x="10" y="28" fill="#202724" font-size="22" font-weight="900">A♠</text></g>
  <g transform="translate(649 548) rotate(4)"><rect width="74" height="104" rx="8" fill="#fdf8eb" stroke="#d4cbb7" stroke-width="3"/><text x="10" y="28" fill="#c63838" font-size="22" font-weight="900">K♥</text></g>
  <g transform="translate(817 586)"><ellipse class="chip" rx="21" ry="8"/><rect x="-21" y="-43" width="42" height="43" fill="#256d98"/><ellipse class="chip" cy="-43" rx="21" ry="8"/><text x="0" y="20" class="micro" text-anchor="middle">HERO STACK</text></g>

  <!-- Command rail is deliberately separate from the felt -->
  <g class="ui">
    <rect x="277" y="698" width="812" height="58" rx="13" fill="#020806" fill-opacity=".96" stroke="#48695f"/>
    <rect x="290" y="710" width="220" height="34" rx="9" fill="#492220" stroke="#b8615d"/><text x="400" y="733" text-anchor="middle" font-weight="800">FOLD · F</text>
    <rect x="520" y="710" width="264" height="34" rx="9" fill="#174e42" stroke="#55cdb4"/><text x="652" y="727" text-anchor="middle" font-weight="800">CALL 50 · C</text><text x="652" y="740" text-anchor="middle" class="micro">TO CALL</text>
    <rect x="794" y="710" width="282" height="34" rx="9" fill="#59431f" stroke="#d4a852"/><text x="935" y="733" text-anchor="middle" font-weight="800">RAISE · R</text>
  </g>
  <g class="annot">
    <text x="24" y="742">B · ELEVATED OVER-THE-RAIL · READABILITY-FIRST</text>
    <path d="M111 520 L235 470" stroke="#f0c66a"/><text x="24" y="535">MORE FELT, LESS ROOM</text>
    <path d="M1158 565 L1108 603" stroke="#f0c66a"/><text x="1139" y="555">HERO HANDS</text>
  </g>
</svg>
