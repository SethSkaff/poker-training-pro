<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title desc">
  <title id="title">Direction C — body-aware shoulder composition at 1366 by 768</title>
  <desc id="desc">An asymmetric camera sits over the hero's right shoulder. The hero torso and arm frame the right foreground, cards sit close at lower center-left, and five opponents occupy an angled table with a compact rail-side action console.</desc>
  <defs>
    <linearGradient id="roomC" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18221f"/><stop offset=".44" stop-color="#09120f"/><stop offset="1" stop-color="#020605"/></linearGradient>
    <linearGradient id="feltC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#287d64"/><stop offset="1" stop-color="#0b3c2e"/></linearGradient>
    <filter id="shadowC" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".72"/></filter>
    <style>
      .ui { font-family: Inter, Segoe UI, sans-serif; fill:#f4f8f5 }
      .micro { font-family: Inter, Segoe UI, sans-serif; font-size:10px; fill:#9fb4ad; letter-spacing:.08em }
      .label { font-family: Inter, Segoe UI, sans-serif; font-size:12px; font-weight:800; fill:#f3f8f5 }
      .amount { font-family: Inter, Segoe UI, sans-serif; font-size:10px; font-weight:700; fill:#7fe4ca }
      .annot { font-family: Inter, Segoe UI, sans-serif; font-size:10px; font-weight:800; fill:#f0c66a; letter-spacing:.06em }
      .plate { fill:#05100c; fill-opacity:.94; stroke:#526e66 }
      .chip { fill:#2d7cab; stroke:#bee4f6 }
    </style>
  </defs>
  <rect width="1366" height="768" fill="url(#roomC)"/>
  <rect x="1" y="1" width="1364" height="766" fill="none" stroke="#46665d" stroke-width="2"/>
  <path d="M0 192 H1366" stroke="#c0d9d0" stroke-opacity=".25" stroke-dasharray="9 10"/>
  <text x="24" y="183" class="micro">HORIZON 25% · CAMERA OFFSET RIGHT</text>
  <g opacity=".3">
    <ellipse cx="115" cy="228" rx="88" ry="23" fill="#17543f" stroke="#68482d" stroke-width="7"/>
    <ellipse cx="1180" cy="215" rx="92" ry="24" fill="#17543f" stroke="#68482d" stroke-width="7"/>
    <ellipse cx="690" cy="220" rx="70" ry="19" fill="#17543f" stroke="#68482d" stroke-width="6"/>
    <path d="M210 0 h50 l85 215 h-220 zM655 0 h50 l85 215 h-220 zM1100 0 h50 l85 215 h-220 z" fill="#ffe0a0" opacity=".36"/>
  </g>

  <!-- HUD follows a centred safe zone; skip sits in the empty left room wing -->
  <g class="ui">
    <rect x="18" y="14" width="1330" height="43" rx="11" fill="#020b08" fill-opacity=".9" stroke="#35554d"/>
    <text x="38" y="31" class="micro">NORMAL · LOCAL QUALIFIER</text><text x="38" y="47" class="label">Hand 1 · 6 remain</text>
    <text x="683" y="40" text-anchor="middle" class="label">BLINDS 25/50 · ANTE 50 · POT 1,250</text>
    <text x="1138" y="40" class="micro">CAMERA: SHOULDER RIGHT</text>
    <rect x="58" y="82" width="100" height="38" rx="10" fill="#f1bc52"/><text x="108" y="106" text-anchor="middle" fill="#201306" font-weight="900">SKIP</text>
  </g>

  <!-- Angled table: asymmetry creates a cinematic body-aware seat -->
  <g transform="rotate(-5 658 462)" filter="url(#shadowC)">
    <path d="M130 388 C170 292 332 259 525 255 L920 255 C1084 267 1196 319 1206 407
             L1180 515 C1158 589 1028 622 839 633 L430 631 C257 617 141 568 119 487 Z"
          fill="#2a1a11" stroke="#8f5a34" stroke-width="22"/>
    <path d="M161 391 C199 318 345 290 529 287 L908 287 C1058 297 1161 337 1175 409
             L1150 493 C1127 548 1014 579 833 590 L441 588 C282 576 178 539 151 478 Z"
          fill="url(#feltC)" stroke="#cc9551" stroke-opacity=".45" stroke-width="3"/>
  </g>

  <!-- Five opponents on an asymmetric horseshoe -->
  <g filter="url(#shadowC)">
    <g transform="translate(168 404) rotate(-8)"><path d="M-41 18Q0-12 41 18L48 85H-48Z" fill="#405769"/><circle cy="1" r="23" fill="#bc8868"/><rect class="plate" x="-68" y="74" width="136" height="38" rx="9"/><text class="label" x="0" y="90" text-anchor="middle">Zuri Eriksen</text><text class="amount" x="0" y="105" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(358 263) rotate(-4)"><path d="M-38 18Q0-12 38 18L44 80H-44Z" fill="#594155"/><circle cy="2" r="22" fill="#9e7057"/><rect class="plate" x="-68" y="72" width="136" height="38" rx="9"/><text class="label" x="0" y="88" text-anchor="middle">Onyx Frost</text><text class="amount" x="0" y="103" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(661 220)"><path d="M-38 18Q0-12 38 18L44 80H-44Z" fill="#3f5669"/><circle cy="2" r="22" fill="#c9986f"/><rect class="plate" x="-68" y="72" width="136" height="38" rx="9"/><text class="label" x="0" y="88" text-anchor="middle">Tam Batista</text><text class="amount" x="0" y="103" text-anchor="middle">15,000 · 300 bb</text></g>
    <g transform="translate(942 251) rotate(4)"><path d="M-38 18Q0-12 38 18L44 80H-44Z" fill="#415b45"/><circle cy="2" r="22" fill="#b97d58"/><ellipse cy="87" rx="65" ry="21" fill="none" stroke="#f3c15c" stroke-width="5"/><rect class="plate" x="-68" y="72" width="136" height="38" rx="9" stroke="#f3c15c"/><text class="label" x="0" y="88" text-anchor="middle">Casey Ibarra</text><text class="amount" x="0" y="103" text-anchor="middle">RAISE 300 · CURRENT ACTOR</text></g>
    <g transform="translate(1120 374) rotate(8)"><path d="M-41 18Q0-12 41 18L48 85H-48Z" fill="#57413a"/><circle cy="1" r="23" fill="#d0a078"/><rect class="plate" x="-68" y="-49" width="136" height="38" rx="9"/><text class="label" x="0" y="-33" text-anchor="middle">Indigo Moreno</text><text class="amount" x="0" y="-18" text-anchor="middle">14,975 · 299.5 bb</text></g>
  </g>

