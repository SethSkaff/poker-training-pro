  <g class="ui" transform="rotate(-5 655 438)">
    <g transform="translate(494 380)">
      <rect width="44" height="62" rx="5" fill="#fffaf0"/><text x="8" y="20" fill="#c63838" font-weight="900">2♦</text>
      <rect x="50" width="44" height="62" rx="5" fill="#fffaf0"/><text x="58" y="20" fill="#202724" font-weight="900">3♠</text>
      <rect x="100" width="44" height="62" rx="5" fill="#fffaf0"/><text x="108" y="20" fill="#202724" font-weight="900">2♣</text>
      <rect x="150" width="44" height="62" rx="5" fill="#15372d" stroke="#6f9286" stroke-dasharray="4 4"/>
      <rect x="200" width="44" height="62" rx="5" fill="#15372d" stroke="#6f9286" stroke-dasharray="4 4"/>
    </g>
    <g transform="translate(674 478)"><ellipse class="chip" rx="18" ry="7"/><rect x="-18" y="-26" width="36" height="26" fill="#256d98"/><ellipse class="chip" cy="-26" rx="18" ry="7"/><text x="0" y="20" class="micro" text-anchor="middle">MAIN 1,125</text></g>
    <g transform="translate(774 481)"><rect x="-45" y="-27" width="90" height="52" rx="12" fill="none" stroke="#a0d6c5" stroke-dasharray="5 5"/><ellipse cx="0" cy="-7" rx="14" ry="6" fill="#d29932"/><text x="0" y="17" class="micro" text-anchor="middle">SIDE POT</text></g>
    <circle cx="977" cy="348" r="16" fill="#f4f0e5" stroke="#efc360" stroke-width="2"/><text x="977" y="353" text-anchor="middle" fill="#21160d" font-weight="900">D</text>
    <rect x="1058" y="421" width="34" height="20" rx="10" fill="#8bc8ff"/><text x="1075" y="435" text-anchor="middle" fill="#11233a" font-size="10" font-weight="900">SB</text>
    <rect x="210" y="445" width="34" height="20" rx="10" fill="#efc45d"/><text x="227" y="459" text-anchor="middle" fill="#30230c" font-size="10" font-weight="900">BB</text>
  </g>

  <!-- Hero body-aware foreground -->
  <path d="M1090 458 Q1270 430 1366 532 V768 H1014 Q1028 610 1090 458 Z" fill="#172a34" stroke="#304b57" stroke-width="4"/>
  <ellipse cx="1258" cy="381" rx="78" ry="92" fill="#c18b68" opacity=".96"/>
  <path d="M1088 533 Q935 568 849 646" fill="none" stroke="#bd8462" stroke-width="42" stroke-linecap="round"/>
  <path d="M1088 533 Q935 568 849 646" fill="none" stroke="#d6a17c" stroke-width="22" stroke-linecap="round"/>
  <text x="1197" y="555" class="annot">HERO SHOULDER</text>

  <!-- Hero cards sit left of the body, chips under the physical hand -->
  <g transform="translate(486 569) rotate(-8)"><rect width="78" height="108" rx="8" fill="#fdf8eb" stroke="#d4cbb7" stroke-width="3"/><text x="11" y="29" fill="#202724" font-size="23" font-weight="900">A♠</text></g>
  <g transform="translate(571 557) rotate(1)"><rect width="78" height="108" rx="8" fill="#fdf8eb" stroke="#d4cbb7" stroke-width="3"/><text x="11" y="29" fill="#c63838" font-size="23" font-weight="900">K♥</text></g>
  <g transform="translate(803 622)"><ellipse class="chip" rx="22" ry="8"/><rect x="-22" y="-44" width="44" height="44" fill="#256d98"/><ellipse class="chip" cy="-44" rx="22" ry="8"/><text x="0" y="21" class="micro" text-anchor="middle">HERO STACK</text></g>
  <text x="553" y="696" class="annot" text-anchor="middle">PHYSICAL PEEK ZONE</text>

  <!-- Compact right-hand rail console -->
  <g class="ui">
    <rect x="930" y="626" width="414" height="124" rx="18" fill="#020806" fill-opacity=".96" stroke="#496a60"/>
    <text x="950" y="648" class="micro">TO CALL 50 · ACTION CONSOLE</text>
    <rect x="946" y="662" width="114" height="38" rx="9" fill="#492220" stroke="#b8615d"/><text x="1003" y="686" text-anchor="middle" font-weight="800">FOLD</text>
    <rect x="1070" y="662" width="122" height="38" rx="9" fill="#174e42" stroke="#55cdb4"/><text x="1131" y="686" text-anchor="middle" font-weight="800">CALL 50</text>
    <rect x="1202" y="662" width="126" height="38" rx="9" fill="#59431f" stroke="#d4a852"/><text x="1265" y="686" text-anchor="middle" font-weight="800">RAISE</text>
    <text x="950" y="727" class="micro">F / C / R · CONTROLLER FOCUS RING RETAINED</text>
  </g>

  <g class="annot">
    <text x="24" y="742">C · BODY-AWARE SHOULDER · ASYMMETRIC CINEMATIC SEAT</text>
    <path d="M157 142 L89 120" stroke="#f0c66a"/><text x="174" y="145">SKIP IN EMPTY ROOM WING</text>
    <path d="M1013 590 L943 626" stroke="#f0c66a"/><text x="971" y="583">RIGHT-HAND CONSOLE</text>
  </g>
